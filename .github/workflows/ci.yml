name: KernelCI RISC-V CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pipeline-light:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install RISC-V cross toolchain and build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-riscv64-linux-gnu flex bison bc libssl-dev libelf-dev

      - name: Fetch Linux kernel (shallow)
        run: git clone --depth 1 https://github.com/torvalds/linux.git ~/linux

      - name: Generate riscv defconfig
        run: make -C ~/linux ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- defconfig

      - name: Config drift check (FAIL-level gates, WARN tolerated)
        # Runner toolchain version differs from the WSL baseline, so value
        # changes (CC_VERSION_TEXT etc.) are expected -> tolerate exit 1,
        # fail hard only on exit 2 (missing/disabled required options).
        run: |
          ACTUAL=~/linux/.config ./scripts/check-config-drift.sh; rc=$?
          if [ "$rc" -ge 2 ]; then exit "$rc"; fi
          echo "config-drift exit=$rc (toolchain WARN tolerated on runner)"
          cat build/config-drift.json

      - name: Install uapi headers
        run: make -C ~/linux ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- headers

      - name: Cross-build riscv kselftests
        run: |
          make -C ~/linux/tools/testing/selftests/riscv \
            ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- \
            OUTPUT=$PWD/build/kselftest -j2 \
            || echo "(note: some subtargets may fail to build, e.g. cfi)"

      - name: Cross-build vector_add (static)
        run: |
          mkdir -p build
          riscv64-linux-gnu-gcc -static -O2 -march=rv64gcv \
            tests/vector/vector_add.c -o build/vector_add
          file build/vector_add

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: riscv-test-artifacts
          path: |
            build/vector_add
            build/kselftest
            build/config-drift.json
