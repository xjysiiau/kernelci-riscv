name: KernelCI RISC-V CI

on:
  push:
    paths:
      - 'scripts/**'
      - 'configs/**'
      - 'tests/**'
      - '.github/**'
  pull_request:
  workflow_dispatch:

jobs:
  pipeline-light:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install RISC-V cross toolchain and build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-riscv64-linux-gnu libc6-dev-riscv64-cross \
            flex bison bc libssl-dev libelf-dev

      - name: Fetch Linux kernel (shallow, pinned to baseline version)
        run: git clone --depth 1 --branch v7.2-rc7 https://github.com/torvalds/linux.git ~/linux

      - name: Apply repo defconfig (olddefconfig)
        run: |
          cp configs/riscv-qemu/defconfig ~/linux/.config
          make -C ~/linux ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- olddefconfig

      - name: Config drift check (required contract gates)
        # The runner toolchain differs from the WSL baseline, so only the
        # toolchain-independent required-opts contract gates this step;
        # the full diff is computed and reported for information.
        run: |
          DRIFT_STRICT=required ACTUAL=~/linux/.config ./scripts/check-config-drift.sh
          cat build/config-drift.json

      - name: Install uapi headers
        run: make -C ~/linux ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- headers

      - name: Cross-build riscv kselftests
        run: |
          make -C ~/linux/tools/testing/selftests/riscv \
            ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- \
            OUTPUT=$PWD/build/kselftest -j2 \
            || echo "(note: some subtargets may fail to build, e.g. cfi)"

      - name: Cross-build vector_add (static)
        run: |
          mkdir -p build
          riscv64-linux-gnu-gcc -static -O2 -march=rv64gcv \
            tests/vector/vector_add.c -o build/vector_add
          file build/vector_add

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: riscv-test-artifacts
          path: |
            build/vector_add
            build/kselftest
            build/config-drift.json

  # Full closed loop (boot + guest tests) on the self-hosted WSL runner.
  # Only when pipeline code changes or triggered manually — it boots QEMU
  # and takes ~12 minutes.
  pipeline-heavy:
    runs-on: self-hosted
    timeout-minutes: 60
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Config drift check (required contract)
        run: |
          DRIFT_STRICT=required ACTUAL=$HOME/kernelci-work/linux/.config ./scripts/check-config-drift.sh
          cat build/config-drift.json

      - name: Full closed loop (boot seeded image + guest tests)
        run: |
          export http_proxy=http://127.0.0.1:7890 https_proxy=http://127.0.0.1:7890
          ./scripts/run-closed-loop.sh

      # Results are persisted via the record/publish step below (history in
      # git), so no artifact upload here — self-hosted runners can have
      # flaky artifact-upload connectivity.

      - name: Record result history and publish
        if: always()
        run: |
          ./scripts/record-result.sh build/closed-loop/guest-results/results.json || echo "(no results to record)"
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add results/
          if git diff --cached --quiet; then
            echo "no history changes to publish"
          else
            git commit -m "ci: record regression results $(date -u +%Y%m%d-%H%M%S)"
            git push || echo "WARNING: history push failed (check Workflow permissions = Read and write)"
          fi
